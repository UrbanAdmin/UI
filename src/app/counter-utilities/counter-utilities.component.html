<mat-tab-group>
  <mat-tab label="Apt 101"></mat-tab>
  <mat-tab label="Apto 201"></mat-tab>
  <mat-tab label="Apto 202"></mat-tab>
</mat-tab-group>

<div class="table-container">
  <table mat-table [dataSource]="dataSource" class="mat-elevation-z1">
    <ng-container matColumnDef="mes">
      <th mat-header-cell *matHeaderCellDef> Mes </th>
      <td mat-cell *matCellDef="let element"> {{element.mes}} </td>
    </ng-container>
    <ng-container matColumnDef="evidencia">
      <th mat-header-cell *matHeaderCellDef> Evidencia </th>
      <td mat-cell *matCellDef="let element">
        <a *ngIf="element.evidencia" href="#">{{element.evidencia}}</a>
      </td>
    </ng-container>
    <tr mat-header-row *matHeaderRowDef="displayedColumns"></tr>
    <tr mat-row *matRowDef="let row; columns: displayedColumns;"></tr>
  </table>
</div>

<div class="button-container">
  <button mat-raised-button color="primary" (click)="openAddReadingDialog()">Agregar Lectura (Imagen)</button>
  <button mat-raised-button color="primary" (click)="openAddManualReadingDialog()">Agregar Lectura (Manual)</button>
</div>
