<h2 mat-dialog-title>{{ isEdit ? 'Editar apartamento' : 'Nuevo apartamento' }}</h2>
<mat-dialog-content>
    <form>
      <mat-form-field appearance="outline" class="full-width">
        <mat-label>Número</mat-label>
        <input matInput type="text" [(ngModel)]="number" name="number" />
      </mat-form-field>

      <mat-form-field appearance="outline" class="full-width">
        <mat-label>Estado</mat-label>
        <mat-select [(ngModel)]="status" name="status">
          <mat-option value="Arrendado">Arrendado</mat-option>
          <mat-option value="No arrendado">No arrendado</mat-option>
        </mat-select>
      </mat-form-field>

      <mat-form-field appearance="outline" class="full-width">
        <mat-label>Arrendatario{{ ownerRequired ? '' : ' (opcional)' }}</mat-label>
        <input
          matInput
          type="text"
          [(ngModel)]="owner"
          name="owner"
          [placeholder]="ownerRequired ? '' : 'Sin arrendatario'"
        />
      </mat-form-field>

      <mat-form-field appearance="outline" class="full-width">
        <mat-label>Fecha inicio contrato</mat-label>
        <input matInput [matDatepicker]="contractPicker" [(ngModel)]="contractStartDate" name="contractStartDate" />
        <mat-datepicker-toggle matIconSuffix [for]="contractPicker"></mat-datepicker-toggle>
        <mat-datepicker #contractPicker></mat-datepicker>
      </mat-form-field>

      <div class="contract-row">
        @if (hasContract) {
          <button mat-stroked-button type="button" (click)="viewContract()">
            Ver contrato ({{ contractFileName }})
          </button>
        }
        <label class="file-input-label">
          <input type="file" (change)="onFileSelected($event)" accept=".pdf,.doc,.docx,image/*" />
        </label>
      </div>

      @if (saveError(); as error) {
        <div class="error">
          <mat-icon>error_outline</mat-icon>
          <span>{{ error }}</span>
        </div>
      }
    </form>
</mat-dialog-content>
<mat-dialog-actions align="end">
  <button mat-raised-button color="primary" (click)="save()" [disabled]="!number || (ownerRequired && !owner)">Guardar</button>
</mat-dialog-actions>
