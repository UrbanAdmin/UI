<app-page-header
  [kicker]="'Servicio · ' + selectedService"
  title="Lecturas"
  [hint]="isReadOnly ? 'Tu consumo mes a mes y la parte del recibo que te corresponde.' : 'Registra el total del recibo y la lectura de cada contador; el sistema reparte el valor por consumo.'"
/>

<div class="service-pills-wrap">
  <p class="pills-kicker">Servicio</p>
  <div class="pills">
    @for (service of services; track service) {
      <button
        type="button"
        class="pill"
        [class.pill--active]="selectedService === service"
        (click)="selectedService = service"
      >
        {{ service }}
      </button>
    }
  </div>
</div>

@if (selectedService === 'Gas') {
  <app-gas-billing />
} @else if (selectedService === 'Agua') {
  <app-agua-billing />
} @else {
  @if (!isReadOnly) {
    <div class="period-picker">
      <div class="field">
        <label>Mes</label>
        <mat-form-field appearance="outline" class="flat-field">
          <mat-select [(ngModel)]="selectedReceiptMonth">
            @for (name of monthNames; track name; let i = $index) {
              <mat-option [value]="i + 1">{{ name }}</mat-option>
            }
          </mat-select>
        </mat-form-field>
      </div>
      <div class="field">
        <label>Año</label>
        <mat-form-field appearance="outline" class="flat-field">
          <mat-select [(ngModel)]="selectedReceiptYear">
            @for (year of years; track year) {
              <mat-option [value]="year">{{ year }}</mat-option>
            }
          </mat-select>
        </mat-form-field>
      </div>
    </div>

    <app-receipt-card [service]="selectedService" [month]="selectedReceiptMonth" [year]="selectedReceiptYear" />
  }

  <app-reading-table [service]="selectedService" [isReadOnly]="isReadOnly" />
}
