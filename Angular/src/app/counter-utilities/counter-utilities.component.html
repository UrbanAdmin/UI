@if (apartments$ | async; as apartments) {
<mat-tab-group>
  @for (apartment of apartments; track apartment.number) {
    <mat-tab [label]="'Apto ' + apartment.number">
      <div class="tab-content">
        <mat-tab-group>
          @for (service of services; track service) {
            <mat-tab [label]="service">
              <div class="table-container">
                <table mat-table [dataSource]="getRows(apartment.number, service)" class="mat-elevation-z1">
                  <ng-container matColumnDef="mes">
                    <th mat-header-cell *matHeaderCellDef>Mes</th>
                    <td mat-cell *matCellDef="let row">{{ row.monthLabel }}</td>
                  </ng-container>

                  <ng-container matColumnDef="lectura">
                    <th mat-header-cell *matHeaderCellDef>Lectura</th>
                    <td mat-cell *matCellDef="let row">{{ row.counterValue ?? '—' }}</td>
                  </ng-container>

                  <ng-container matColumnDef="evidencia">
                    <th mat-header-cell *matHeaderCellDef>Evidencia</th>
                    <td mat-cell *matCellDef="let row">{{ row.evidenceFileName ?? '—' }}</td>
                  </ng-container>

                  <tr mat-header-row *matHeaderRowDef="displayedColumns"></tr>
                  <tr mat-row *matRowDef="let row; columns: displayedColumns;"></tr>
                </table>
              </div>
              <div class="button-container-inline">
                <button mat-raised-button color="primary" (click)="openAddReadingDialog(apartment, service)">Agregar Lectura (Imagen)</button>
                <button mat-raised-button color="primary" (click)="openAddManualReadingDialog(apartment, service)">Agregar Lectura (Manual)</button>
              </div>
            </mat-tab>
          }
        </mat-tab-group>
      </div>
    </mat-tab>
  }
</mat-tab-group>
}
