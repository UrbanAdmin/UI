@if (!isReadOnly) {
  <button type="button" class="cycle-link" data-testid="agua-cycle-link" (click)="openAguaCycleDialog()">
    <mat-icon>schedule</mat-icon>
    Configurar periodo de facturación
  </button>

  <div class="field">
    <label>Periodo</label>
    <mat-form-field appearance="outline" class="flat-field">
      <mat-select [(ngModel)]="selectedAguaPeriodKey" (ngModelChange)="onAguaPeriodChanged()">
        @for (period of aguaPeriods; track periodKey(period)) {
          <mat-option [value]="periodKey(period)">{{ period.label }}</mat-option>
        }
      </mat-select>
    </mat-form-field>
  </div>

  <app-receipt-card [service]="'Agua'" [month]="selectedMonth" [year]="selectedYear" />
}

<app-reading-table [service]="'Agua'" [isReadOnly]="isReadOnly" (readingSaved)="onReadingSaved()" />
