<mat-card>
  <mat-card-title>Pagos</mat-card-title>
  <mat-card-content>
    <div class="filters">
      <mat-form-field appearance="outline">
        <mat-label>Servicio</mat-label>
        <mat-select [(ngModel)]="selectedService" (selectionChange)="onPeriodChange()">
          @for (service of services; track service) {
            <mat-option [value]="service">{{ service }}</mat-option>
          }
        </mat-select>
      </mat-form-field>

      <mat-form-field appearance="outline">
        <mat-label>Mes</mat-label>
        <input matInput type="number" min="1" max="12" [(ngModel)]="selectedMonth" (ngModelChange)="onPeriodChange()" />
      </mat-form-field>

      <mat-form-field appearance="outline">
        <mat-label>Año</mat-label>
        <input matInput type="number" [(ngModel)]="selectedYear" (ngModelChange)="onPeriodChange()" />
      </mat-form-field>
    </div>

    <div class="deadline-row">
      <mat-form-field appearance="outline">
        <mat-label>Fecha límite de pago</mat-label>
        <input matInput type="date" [ngModel]="deadlineInputValue" #deadlineInput="ngModel" />
      </mat-form-field>
      <button mat-flat-button color="primary" (click)="onSaveDeadlineClick(deadlineInput.value)" [disabled]="!deadlineInput.value">
        Guardar
      </button>
    </div>

    <table mat-table [dataSource]="rows" class="mat-elevation-z1">
      <ng-container matColumnDef="apartment">
        <th mat-header-cell *matHeaderCellDef>Apartamento</th>
        <td mat-cell *matCellDef="let row">{{ row.apartment }}</td>
      </ng-container>

      <ng-container matColumnDef="owner">
        <th mat-header-cell *matHeaderCellDef>Propietario</th>
        <td mat-cell *matCellDef="let row">{{ row.owner }}</td>
      </ng-container>

      <ng-container matColumnDef="status">
        <th mat-header-cell *matHeaderCellDef>Estado</th>
        <td mat-cell *matCellDef="let row">
          <mat-chip-set>
            <mat-chip [class]="'status-' + row.status">{{ statusLabel(row.status) }}</mat-chip>
          </mat-chip-set>
        </td>
      </ng-container>

      <ng-container matColumnDef="paid">
        <th mat-header-cell *matHeaderCellDef>Pagado</th>
        <td mat-cell *matCellDef="let row">
          <mat-slide-toggle [checked]="row.paid" (change)="onTogglePaid(row, $event)"></mat-slide-toggle>
        </td>
      </ng-container>

      <tr mat-header-row *matHeaderRowDef="displayedColumns"></tr>
      <tr mat-row *matRowDef="let row; columns: displayedColumns"></tr>
    </table>
  </mat-card-content>
</mat-card>
