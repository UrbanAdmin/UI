<mat-card>
  <mat-card-title>Usuarios</mat-card-title>
  <mat-card-content>
    <div class="toolbar">
      <button mat-flat-button color="primary" (click)="openCreateDialog()">
        <mat-icon>add</mat-icon>
        Agregar usuario
      </button>
    </div>

    <div class="table-scroll">
    <table mat-table [dataSource]="(users$ | async) ?? []" class="mat-elevation-z1">
      <ng-container matColumnDef="username">
        <th mat-header-cell *matHeaderCellDef>Usuario</th>
        <td mat-cell *matCellDef="let user">{{ user.username }}</td>
      </ng-container>

      <ng-container matColumnDef="role">
        <th mat-header-cell *matHeaderCellDef>Rol</th>
        <td mat-cell *matCellDef="let user">{{ roleLabel(user.role) }}</td>
      </ng-container>

      <ng-container matColumnDef="apartment">
        <th mat-header-cell *matHeaderCellDef>Apartamento</th>
        <td mat-cell *matCellDef="let user">{{ apartmentNumber(user.apartmentId) }}</td>
      </ng-container>

      <ng-container matColumnDef="actions">
        <th mat-header-cell *matHeaderCellDef></th>
        <td mat-cell *matCellDef="let user" class="actions-cell">
          <button mat-icon-button (click)="openEditDialog(user)" aria-label="Editar">
            <mat-icon>edit</mat-icon>
          </button>
          <button mat-icon-button (click)="deleteUser(user)" aria-label="Eliminar">
            <mat-icon>delete</mat-icon>
          </button>
        </td>
      </ng-container>

      <tr mat-header-row *matHeaderRowDef="displayedColumns"></tr>
      <tr mat-row *matRowDef="let row; columns: displayedColumns"></tr>
    </table>
    </div>
  </mat-card-content>
</mat-card>
