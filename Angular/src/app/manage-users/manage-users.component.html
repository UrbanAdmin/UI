<app-page-header
  kicker="Cuentas y roles"
  title="Usuarios"
  hint="Cada inquilino ve solo su apartamento; el admin ve todo."
/>

<div class="toolbar">
  <button mat-flat-button color="primary" (click)="openCreateDialog()">
    <mat-icon>add</mat-icon>
    Agregar usuario
  </button>
</div>

@if (deleteError(); as error) {
  <div class="error">
    <mat-icon>error_outline</mat-icon>
    <span>{{ error }}</span>
  </div>
}

@if (loadingService.isLoading()) {
  <app-loading-indicator [loading]="true" />
} @else if (users$ | async; as users) {
  @if (users.length === 0) {
    <app-empty-state
      icon="group"
      message="Todavía no hay usuarios registrados."
      actionLabel="Agregar usuario"
      (action)="openCreateDialog()"
    />
  } @else {
    <div class="table-scroll">
    <table mat-table [dataSource]="users">
      <ng-container matColumnDef="username">
        <th mat-header-cell *matHeaderCellDef>Usuario</th>
        <td mat-cell *matCellDef="let user">{{ user.username }}</td>
      </ng-container>

      <ng-container matColumnDef="role">
        <th mat-header-cell *matHeaderCellDef>Rol</th>
        <td mat-cell *matCellDef="let user">
          <span class="status-chip" [class.status-chip--admin]="user.role === 'Admin'">{{ roleLabel(user.role) }}</span>
        </td>
      </ng-container>

      <ng-container matColumnDef="apartment">
        <th mat-header-cell *matHeaderCellDef>Apartamento</th>
        <td mat-cell *matCellDef="let user">{{ apartmentNumber(user.apartmentId) }}</td>
      </ng-container>

      <ng-container matColumnDef="actions">
        <th mat-header-cell *matHeaderCellDef></th>
        <td mat-cell *matCellDef="let user" class="actions-cell">
          <button class="text-link" (click)="openEditDialog(user)">Editar</button>
          <button class="text-link" (click)="deleteUser(user)">Eliminar</button>
        </td>
      </ng-container>

      <tr mat-header-row *matHeaderRowDef="displayedColumns"></tr>
      <tr mat-row *matRowDef="let row; columns: displayedColumns"></tr>
    </table>
    </div>
  }
}
