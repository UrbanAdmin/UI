<div class="dashboard">
  @for (card of quickAccessCards; track card.path) {
    @if (!card.adminOnly || isAdmin) {
      <mat-card class="quick-access-card" [routerLink]="[card.path]" data-testid="quick-access-card">
        <mat-card-content>
          <span class="card-icon-disc">
            <mat-icon class="card-icon">{{ card.icon }}</mat-icon>
          </span>
          <span class="card-label">{{ card.label }}</span>
          @if (card.path === '/notifications' && pendingNotificationsCount() > 0) {
            <span class="card-badge">{{ pendingNotificationsCount() }}</span>
          }
        </mat-card-content>
      </mat-card>
    }
  }
</div>
