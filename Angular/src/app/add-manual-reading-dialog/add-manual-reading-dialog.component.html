<mat-card>
  <mat-card-title>Lectura Gas</mat-card-title>
  <mat-card-content>
    <form>
      <mat-form-field appearance="outline" class="full-width">
        <mat-label>Mes</mat-label>
        <mat-select>
          <mat-option value="Enero">Enero</mat-option>
          <mat-option value="Febrero">Febrero</mat-option>
          <mat-option value="Marzo">Marzo</mat-option>
        </mat-select>
      </mat-form-field>

      <mat-form-field appearance="outline" class="full-width">
        <mat-label>Lectura Actual 101</mat-label>
        <input matInput type="number" />
      </mat-form-field>

      <mat-form-field appearance="outline" class="full-width">
        <mat-label>Lectura Actual 201</mat-label>
        <input matInput type="number" />
      </mat-form-field>

      <mat-form-field appearance="outline" class="full-width">
        <mat-label>Total Consumo Factura</mat-label>
        <input matInput type="number" />
      </mat-form-field>

      <mat-form-field appearance="outline" class="full-width">
        <mat-label>Total a pagar</mat-label>
        <input matInput type="number" />
      </mat-form-field>
    </form>
  </mat-card-content>
  <mat-card-actions align="end">
    <button mat-raised-button color="primary">Guardar</button>
    <button mat-raised-button color="accent">Calcular</button>
  </mat-card-actions>
</mat-card>
