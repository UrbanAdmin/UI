<mat-card>
  <mat-card-title>Lectura {{ data.service }} &middot; Apto {{ data.apartment }}</mat-card-title>
  <mat-card-subtitle>{{ data.owner }}</mat-card-subtitle>
  <mat-card-content>
    <form>
      <mat-form-field appearance="outline" class="full-width">
        <mat-label>Mes</mat-label>
        <mat-select [(ngModel)]="month" name="month">
          @for (name of monthNames; track name; let i = $index) {
            <mat-option [value]="i + 1">{{ name }}</mat-option>
          }
        </mat-select>
      </mat-form-field>

      <mat-form-field appearance="outline" class="full-width">
        <mat-label>Lectura actual</mat-label>
        <input matInput type="text" [(ngModel)]="counter" name="counter" />
      </mat-form-field>
    </form>
  </mat-card-content>
  <mat-card-actions align="end">
    <button mat-raised-button color="primary" (click)="save()" [disabled]="!counter">Guardar</button>
  </mat-card-actions>
</mat-card>
