name: Deploy to GitHub Pages

on:
  push:
    branches: [ "main" ]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: Angular
    steps:
      - uses: actions/checkout@v7
      - name: Setup Node.js
        uses: actions/setup-node@v6
        with:
          node-version: 22.23.2
          cache: npm
          cache-dependency-path: Angular/package-lock.json
      - name: Install dependencies
        run: npm ci
      - name: Build (static, base href /UI/)
        run: npx ng build --configuration production --base-href /UI/ --output-mode static
      - name: Upload Pages artifact
        uses: actions/upload-pages-artifact@v4
        with:
          path: Angular/dist/urban-admin-ui/browser

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
