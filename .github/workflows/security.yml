name: Security

on:
  push:
  pull_request:
  schedule:
    - cron: '0 6 * * 1'

permissions:
  contents: read

jobs:
  dependency-review:
    name: Dependency Review
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-latest
    permissions:
      contents: read
      pull-requests: write
    steps:
      - name: Review dependency changes
        uses: actions/dependency-review-action@v4
        with:
          fail-on-severity: moderate
          comment-summary-in-pr: always

  codeql:
    name: CodeQL analysis
    runs-on: ubuntu-latest
    permissions:
      contents: read
      security-events: write
    steps:
      - name: Checkout
        uses: actions/checkout@v7
      - name: Initialize CodeQL
        uses: github/codeql-action/init@v4
        with:
          languages: javascript-typescript, csharp
      - name: Setup .NET
        uses: actions/setup-dotnet@v5
        with:
          dotnet-version: 10.0.x
      - name: Install Android workload
        run: dotnet workload install maui-android
      - name: Restore .NET projects
        run: dotnet restore Mobile/UrbanAdmin.Tenant.Mobile.sln
      - name: Build .NET projects for CodeQL
        run: |
          dotnet build Mobile/UrbanAdmin.Tenant.Mobile.Core/UrbanAdmin.Tenant.Mobile.Core.csproj --no-restore
          dotnet build Mobile/UrbanAdmin.Tenant.Mobile.Tests/UrbanAdmin.Tenant.Mobile.Tests.csproj --no-restore
      - name: Analyze
        uses: github/codeql-action/analyze@v4

  dotnet-dependency-audit:
    name: NuGet dependency audit
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v7
      - name: Setup .NET
        uses: actions/setup-dotnet@v5
        with:
          dotnet-version: 10.0.x
      - name: Install Android workload
        run: dotnet workload install maui-android
      - name: Restore .NET projects
        run: dotnet restore Mobile/UrbanAdmin.Tenant.Mobile.sln
      - name: Check for vulnerable packages
        run: dotnet list Mobile/UrbanAdmin.Tenant.Mobile.sln package --vulnerable --include-transitive

  dependency-audit:
    name: npm dependency audit
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v7
      - name: Setup Node
        uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: Angular/package-lock.json
      - name: Install dependencies
        run: npm ci
        working-directory: Angular
      - name: Check for vulnerable dependencies
        run: npm audit --audit-level=moderate
        working-directory: Angular