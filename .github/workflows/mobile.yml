# CI for the native tenant mobile app (Mobile/). Kept as its own workflow,
# path-scoped to Mobile/**, so Angular-only changes never pay for MAUI
# workload installs and vice versa (see ci.yml's Angular/** scoping).
#
# Windows (net10.0-windows10.0.19041.0) is deliberately not built here: it's
# a conditional TargetFramework only added on Windows hosts, would need a
# windows-latest runner, and is already verified locally on every change.
# Android and iOS are the two platforms that actually ship to tenants, so
# CI focuses its minutes there - and macos-latest can build iOS even though
# local Windows development cannot (Windows MAX_PATH blocks one of the
# Firebase plugin's nested framework bundles; macOS has no such limit).
name: Mobile

on:
  push:
    branches: [ "main" ]
    paths: [ "Mobile/**" ]
  pull_request:
    branches: [ "main" ]
    paths: [ "Mobile/**" ]
  workflow_dispatch:

jobs:
  test:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: Mobile
    steps:
      - uses: actions/checkout@v7
      - name: Setup .NET
        uses: actions/setup-dotnet@v6
        with:
          dotnet-version: 10.0.x
      - name: Restore
        run: dotnet restore UrbanAdmin.Tenant.Mobile.Tests/UrbanAdmin.Tenant.Mobile.Tests.csproj
      - name: Build
        run: dotnet build UrbanAdmin.Tenant.Mobile.Tests/UrbanAdmin.Tenant.Mobile.Tests.csproj --no-restore
      - name: Test
        run: dotnet test UrbanAdmin.Tenant.Mobile.Tests/UrbanAdmin.Tenant.Mobile.Tests.csproj --no-build --verbosity normal

  build-android:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: Mobile
    steps:
      - uses: actions/checkout@v7
      - name: Setup .NET
        uses: actions/setup-dotnet@v6
        with:
          dotnet-version: 10.0.x
      - name: Install MAUI Android workload
        run: dotnet workload install maui-android
      - name: Decode Firebase config (google-services.json)
        # Gitignored (specs/008-mobile-admin-views: contains the Firebase project's API
        # keys/app IDs) but the Firebase Basement build task requires the file to exist -
        # same decode-to-file pattern as mobile-release.yml's signing keystore.
        shell: bash
        run: echo "${{ secrets.GOOGLE_SERVICES_JSON_BASE64 }}" | base64 --decode > google-services.json
        working-directory: Mobile/UrbanAdmin.Tenant.Mobile
      - name: Build (net10.0-android)
        # The project's TargetFrameworks is Linux-conditional (see the .csproj)
        # so on this runner it only ever lists net10.0-android - -f here is
        # just documentation, not load-bearing. Do NOT "fix" this with a
        # command-line -p:TargetFrameworks override instead: that property is
        # global and propagates into the Core ProjectReference (which is
        # single-targeted, not multi-targeted), breaking its restore.
        run: dotnet build UrbanAdmin.Tenant.Mobile/UrbanAdmin.Tenant.Mobile.csproj -f net10.0-android
      - name: Remove decoded Firebase config
        if: always()
        shell: bash
        run: rm -f UrbanAdmin.Tenant.Mobile/google-services.json

  build-ios:
    runs-on: macos-latest
    defaults:
      run:
        working-directory: Mobile
    steps:
      - uses: actions/checkout@v7
      - name: Setup .NET
        uses: actions/setup-dotnet@v6
        with:
          dotnet-version: 10.0.x
      - name: Install MAUI workloads
        # macOS keeps all three non-Windows TFMs listed (android;ios;
        # maccatalyst - see the .csproj), so evaluation needs every one of
        # their manifests resolvable even though we only build iOS below.
        run: dotnet workload install maui-android maui-ios maui-maccatalyst
      - name: Decode Firebase config (GoogleService-Info.plist)
        # Gitignored (specs/008-mobile-admin-views: contains the Firebase project's API
        # keys/app IDs) but the Firebase build task requires the file to exist - same
        # decode-to-file pattern as mobile-release.yml's signing keystore.
        shell: bash
        run: echo "${{ secrets.GOOGLE_SERVICE_INFO_PLIST_BASE64 }}" | base64 --decode > GoogleService-Info.plist
        working-directory: Mobile/UrbanAdmin.Tenant.Mobile
      - name: Build (net10.0-ios)
        run: dotnet build UrbanAdmin.Tenant.Mobile/UrbanAdmin.Tenant.Mobile.csproj -f net10.0-ios
      - name: Remove decoded Firebase config
        if: always()
        shell: bash
        run: rm -f UrbanAdmin.Tenant.Mobile/GoogleService-Info.plist

  build-maccatalyst:
    # Compile check only: the interactive Organic-theme walkthrough (011 T021)
    # still needs a Mac running a current Xcode, which local development lacks.
    runs-on: macos-latest
    defaults:
      run:
        working-directory: Mobile
    steps:
      - uses: actions/checkout@v7
      - name: Setup .NET
        uses: actions/setup-dotnet@v6
        with:
          dotnet-version: 10.0.x
      - name: Install MAUI workloads
        run: dotnet workload install maui-android maui-ios maui-maccatalyst
      - name: Decode Firebase config (GoogleService-Info.plist)
        shell: bash
        run: echo "${{ secrets.GOOGLE_SERVICE_INFO_PLIST_BASE64 }}" | base64 --decode > GoogleService-Info.plist
        working-directory: Mobile/UrbanAdmin.Tenant.Mobile
      - name: Build (net10.0-maccatalyst)
        run: dotnet build UrbanAdmin.Tenant.Mobile/UrbanAdmin.Tenant.Mobile.csproj -f net10.0-maccatalyst
      - name: Remove decoded Firebase config
        if: always()
        shell: bash
        run: rm -f UrbanAdmin.Tenant.Mobile/GoogleService-Info.plist
